jianglindian-lanuch-15=从此无人再敢尝试
jianglindian-lanuch-16=那道劫并未因大能的陨落而彻底消散。
jianglindian-lanuch-17=它像一滴浓墨坠入清水，在两种文明的交界处晕染开来，科技与修行开始相互渗透，破灭，融合
